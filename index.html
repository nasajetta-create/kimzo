<style>
:root{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);

.wrap{max-width:1360px;margin:0 auto;padding:12px 16px 40px;}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);
  border:1.5px solid #666;padding:8px 14px;margin-bottom:10px;}
.topbar .t{font-size:18px;font-weight:bold;}
.topbar .v{font-size:11px;color:var(--muted);}
.pill{border:1px solid #999;padding:4px 14px;font-size:13.5px;background:#f5f5f5;cursor:pointer;user-select:none;}
.pill.on{background:var(--dim);color:#fff;border-color:var(--dim);font-weight:bold;}
#status{margin-left:auto;font-size:12.5px;color:var(--muted);}
#status.ok{color:var(--ok);} #status.bad{color:var(--bad);}
.g24{border:1.5px solid #888;background:#e9e9e9;margin-bottom:8px;}
.g24 .hd{background:#666;color:#fff;font-size:13px;font-weight:bold;padding:6px 12px;display:flex;cursor:pointer;user-select:none;}
.g24 .hd .tg{margin-left:auto;font-weight:normal;font-size:12px;}
.g24 .bd{padding:8px 10px;overflow-x:auto;}
.g24 table{background:#f2f2f2;min-width:760px;font-size:12.5px;}
.g24 th{background:#7a7a7a;}
.g24 td{padding:5px 8px;color:#444;line-height:1.6;background:#f7f7f7;}
.g24 td.it{background:#e2e2e2;font-weight:bold;width:150px;}
.g24 td.wh{width:130px;}
.g24 ol{margin:0;padding-left:17px;}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:0;}
.tab{border:1px solid #999;border-bottom:none;padding:6px 14px;font-size:13.5px;background:#e4e7ea;cursor:pointer;user-select:none;}
.tab.on{background:var(--dim);color:#fff;border-color:var(--dim);font-weight:bold;}
.tblbox{overflow-x:auto;background:var(--card);border:1.5px solid #666;}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px;}
th{background:var(--head);color:#fff;padding:6px 8px;border:1px solid #888;font-size:13.5px;font-weight:bold;}
th.re{background:var(--r1)} th.rg{background:var(--r2)} th.rm{background:var(--r3)} th.rd{background:var(--r4)}
td{border:1px solid var(--line);padding:0;vertical-align:top;}
td.dim{background:var(--dim);color:#fff;font-weight:bold;text-align:center;font-size:13px;width:58px;padding:6px 4px;}
td.item{background:var(--item);font-weight:bold;width:118px;padding:6px 8px;font-size:13px;}
td.item .rn{cursor:pointer;}
td.item .rn:hover{color:var(--accent);text-decoration:underline;}
td.duty{min-width:180px;}
.cellin{padding:6px 8px 3px;cursor:pointer;min-height:38px;}
.cellin:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.cellin ol{margin:0;padding-left:18px;line-height:1.6;}
.cellin li{margin:1px 0;}
.cellin .empty{color:#bbb;}
.cfoot{display:flex;gap:6px;align-items:center;padding:1px 8px 5px;font-size:11px;color:var(--muted);}
.cfoot .cbtn{margin-left:auto;border:1px solid #bbb;background:#f5f5f5;color:#555;font-size:11px;padding:0 8px;cursor:pointer;}
.cfoot .cbtn.has{border-color:var(--accent);color:var(--accent);font-weight:bold;}
.cfoot .pres{color:var(--bad);font-weight:bold;}
.editbox{padding:6px;background:var(--edit);outline:2px solid #e6a817;outline-offset:-2px;}
.editbox textarea{width:100%;min-height:110px;font-size:13px;font-family:inherit;border:1px solid #ccc;padding:6px;line-height:1.6;}
.editbox .hint{font-size:11px;color:var(--muted);margin:2px 0;}
.ebtns{display:flex;gap:6px;margin-top:3px;}
.ebtns button{font-size:12.5px;padding:4px 14px;border:1px solid #999;cursor:pointer;background:#fff;}
.ebtns .save{background:var(--dim);color:#fff;border-color:var(--dim);}
.addrow{margin:8px 0 0;}
.addrow button{font-size:12.5px;padding:5px 14px;border:1px solid var(--dim);background:#fff;color:var(--dim);cursor:pointer;}
.cpanel{display:none;margin-top:12px;background:var(--card);border:1.5px solid var(--accent);padding:10px 14px;}
.cpanel.show{display:block;}
.cpanel h3{font-size:14px;margin:0 0 8px;}
.cone{border-bottom:1px dashed #ccc;padding:4px 0;font-size:12.5px;line-height:1.6;}
.cone .who{font-weight:bold;color:var(--accent);margin-right:8px;}
.cone .when{color:var(--muted);font-size:11px;}
.crow{display:flex;gap:8px;margin-top:8px;}
.crow input{flex:1;font-size:13px;border:1px solid #ccc;padding:5px 8px;}
.crow button{font-size:12.5px;padding:4px 14px;border:1px solid var(--dim);background:var(--dim);color:#fff;cursor:pointer;}
.crow .cls{background:#fff;color:#555;border-color:#999;}
.logsec{margin-top:12px;background:var(--card);border:1.5px solid #666;padding:8px 14px;font-size:12px;color:var(--muted);}
.logsec h3{font-size:13px;margin:0 0 4px;color:var(--ink);}
.logsec div{line-height:1.8;}
.foot{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--dim);color:#fff;
  padding:8px 20px;font-size:13px;display:none;z-index:9;}
.toast.show{display:block;}
</style>
</head>

  {it:"品質查核", who:"四職務", b:["1 所有組立站立吊線均依圖說標示XYZ向為準","2 所有最終完成面均為平整面","3 單元性成品（磁磚、金屬包版、石材等）縫要直且平、縫尺寸相同","4 所有相接表面建材依圖說標示要求","5 鎖固黏貼類底層材料不得膨脹脫層，五金須達抗拉強度及防鏽能力","評級：達到項數"]},
  {it:"估驗計價", who:"四職務", b:["1 分層數量表（子呈）完整標註計價範圍","2 簽收單核實（簽名、計價數量吻合）","3 發票開立項目數量金額無誤","4 代扣廠商確認無誤（廠商簽認）","5 代扣款次月扣款確實","6 各項材料檢試驗報告"]},
  {it:"合約變更單", who:"四職務", b:["1 業主變更指示單、會議紀錄、業主追加減詳細表","2 變更後圖說加原圖說加變更範圍標示","3 數量計算表","4 新增材料報價單","5 客變總表加數量差異統計表","6 錯誤範圍原因說明、數量、工數檢討差異表","7 設計變更追加減（新增追加變更單加追減變更單）併提列提出"]}
 ]},
 m4:{name:"預算成本管理", items:[

  {it:"材料管制及損耗控管", who:"主任、所長", b:["A 材料規格符合合約（業主加廠商）","B 材料進場符合現場作業進度","C 每月檢討材料使用（庫存量、各層損耗、剩餘需求）","D 廠商施工後剩餘材料即時調移轉用","E 材料堆置及分層數量計畫"]},
  {it:"垃圾減量及工區整理整頓之維護", who:"主任、所長", b:["營建廢棄物加民生垃圾","A 建立並執行垃圾分類","B 建材包裝廢料處理","C 廢棄物運棄階段使用量追蹤","D 泥作磁磚材料廢棄數量","E 物料堆置管理"]}
 ]},
 m5:{name:"領導統御", items:[
  {it:"業主滿意度調查", who:"主任、所長", b:["A 特優、B 優、C 普通、D 不佳、E 需改善"]},
  {it:"團體工作氛圍融洽", who:"主任、所長", b:["A 特優、B 優、C 普通、D 不佳、E 需改善"]},
  {it:"團體合作戰力", who:"主任、所長", b:["A 特優、B 優、C 普通、D 不佳、E 需改善"]},
  {it:"協商協調及評價", who:"主任、所長", b:["A 特優、B 優、C 普通、D 不佳、E 需改善"]}
 ]},
 m6:{name:"個人行為態度", items:[
  {it:"出勤", who:"四職務", b:["A 未遲到、B 遲到少於6次、C 遲到少於8次、D 遲到大於8次"]},
  {it:"休假狀況", who:"四職務", b:["以未休假時數計","A 未休假0天、B 少於6天、C 6至12天、D 12天以上"]},
  {it:"服裝儀容、個人裝備", who:"四職務", b:["A 符合規定、B 經提醒符合規定、C 未符規定總是有理由、D 完全不理"]},
  {it:"工務所內整理整頓", who:"四職務", b:["A 保持整齊、B 經提醒會整理、C 總是有理由、D 完全不理"]}
 ]}
};
var g24open = false;

/* ---------- 狀態 ---------- */
var cells = {};    // key m1_111_e -> {lines, by, at, ts}
var rows = {};     // key dimId -> [ {id,name,order} ] 自訂列
var cmts = [];     // {cell, author, text, at, ts}
var logs = [];     // {author, action, name, at, ts}
var pres = {};     // who -> {cell, ts}
var curDim = "m1";
var editingCell = null;
var panelCell = null;
var connected = false;

function now(){
  var d = new Date();
  var p = new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  return p;
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function who(){
  var el = document.querySelector(".pill.on");
  return el ? el.getAttribute("data-who") : "";
}
function toast(t){
  var el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 2400);
}
function setStatus(t, cls){
  var s = document.getElementById("status");
  s.textContent = t; s.className = cls || "";
}
function cellLines(key){
  if (cells[key] && cells[key].lines) return cells[key].lines;
  if (SEED[key]) return SEED[key];
  return [];
}
function allRows(dim){
  var fixed = FIXED_ROWS[dim] ? FIXED_ROWS[dim].slice() : [];
  var extra = (rows[dim]||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  return fixed.concat(extra);
}
function rowName(dim,rowId){
  var list = allRows(dim);
  for (var i=0;i<list.length;i++) if (list[i].id===rowId) return list[i].name;
  return rowId;
}
function cName(key){
  var p = key.split("_"); // dim,row,role
  var rn = ""; ROLES.forEach(function(r){ if(r[0]===p[2]) rn=r[1]; });
  return rowName(p[0],p[1]) + " / " + rn;
}

/* ---------- 畫面 ---------- */
function renderTabs(){
  var h = "";
  DIMS.forEach(function(d){
    h += '<div class="tab'+(d.id===curDim?" on":"")+'" data-dim="'+d.id+'">'+esc(d.tab)+'</div>';
  });
  document.getElementById("tabs").innerHTML = h;
}
function renderG24(){
  var d = DATA24[curDim];
  var box = document.getElementById("g24box");
  if (!d){ box.innerHTML = ""; return; }
  var h = '<div class="g24"><div class="hd" data-act="g24toggle">2024 原始資料　'+esc(d.name)
        + '<span class="tg">唯讀　點此'+(g24open?"收合 ▲":"展開 ▼")+'</span></div>';
  if (g24open){
    h += '<div class="bd"><table><tr><th style="width:150px">2024 項目</th><th>評核基準原文</th><th style="width:130px">適用職務</th></tr>';
    d.items.forEach(function(x){
      h += '<tr><td class="it">'+esc(x.it)+'</td><td><ol>';
      x.b.forEach(function(l){ h += "<li>"+esc(l)+"</li>"; });
      h += '</ol></td><td class="wh">'+esc(x.who)+'</td></tr>';
    });
    h += "</table></div>";
  }
  h += "</div>";
  box.innerHTML = h;
}
function render(){
  renderTabs();
  renderG24();
  var list = allRows(curDim);
  var h = '<tr><th style="width:58px">項目</th><th style="width:118px">內容</th>';
  h += '<th class="re">工程師</th><th class="rg">組長</th><th class="rm">主任</th><th class="rd">所長</th></tr>';
  if (!list.length){
    h += '<tr><td colspan="6" style="padding:14px;text-align:center;color:#999">此構面尚無內容列，按下方「新增內容列」開始</td></tr>';
  }
  // group rowspan 計算
  var spans = {};
  list.forEach(function(r){ var g=r.grp||"自訂"; spans[g]=(spans[g]||0)+1; });
  var printed = {};
  list.forEach(function(r){
    var g = r.grp || "自訂";
    h += "<tr>";
    if (!printed[g]){
      printed[g] = true;
      var gshow = g.split(" ");
      h += '<td class="dim" rowspan="'+spans[g]+'">'+esc(gshow[0])+'<br>'+esc(gshow.slice(1).join(""))+'</td>';
    }
    var fixed = FIXED_ROWS[curDim] && FIXED_ROWS[curDim].some(function(x){return x.id===r.id;});
    h += '<td class="item"><span class="rn"'+(fixed?"":' data-rowedit="'+r.id+'"')+'>'+esc(r.name)+'</span></td>';
    ROLES.forEach(function(role){
      var key = curDim+"_"+r.id+"_"+role[0];
      var lines = cellLines(key);
      var meta = cells[key];
      var n = cmts.filter(function(c){return c.cell===key;}).length;
      h += '<td class="duty" data-cell="'+key+'">';
      if (editingCell===key){
        h += '<div class="editbox"><textarea id="eta">'+esc(lines.join("\n"))+'</textarea>';
        h += '<div class="hint">一行一條，儲存後編號自動產生</div>';
        h += '<div class="ebtns"><button class="save" data-act="save">儲存</button><button data-act="cancel">取消</button></div></div>';
      } else {
        h += '<div class="cellin" data-act="edit">';
        if (!lines.length) h += '<div class="empty">（點此填寫）</div>';
        else { h += "<ol>"; lines.forEach(function(l){ h += "<li>"+esc(l)+"</li>"; }); h += "</ol>"; }
        h += '</div><div class="cfoot">';
        var presTxt = "";
        Object.keys(pres).forEach(function(w){
          if (w!==who() && pres[w] && pres[w].cell===key && (Date.now()-pres[w].ts)<90000) presTxt = w+" 編輯中…";
        });
        if (presTxt) h += '<span class="pres">'+esc(presTxt)+'</span>';
        else if (meta && meta.by) h += '<span>'+esc(meta.by)+' '+esc(meta.at||"")+'</span>';
        h += '<button class="cbtn'+(n?" has":"")+'" data-act="cmt">註'+(n?" "+n:"")+'</button></div>';
      }
      h += "</td>";
    });
    h += "</tr>";
  });
  document.getElementById("tbl").innerHTML = h;
  document.getElementById("addrow").innerHTML =
    FIXED_ROWS[curDim] ? "" : '<button data-act="addrow">新增內容列</button>';
  renderLog(); renderPanel();
}
function renderLog(){
  var el = document.getElementById("loglist");
  var l = logs.slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,10);
  el.innerHTML = l.length ? l.map(function(x){
    return esc(x.at)+"　"+esc(x.author)+"　"+esc(x.action)+"　"+esc(x.name||"");
  }).join("<br>") : "尚無異動";
}
function renderPanel(){
  var p = document.getElementById("cpanel");
  if (!panelCell){ p.classList.remove("show"); return; }
  p.classList.add("show");
  document.getElementById("ctitle").textContent = "留言　" + cName(panelCell);
  var list = cmts.filter(function(c){return c.cell===panelCell;}).sort(function(a,b){return a.ts-b.ts;});
  document.getElementById("clist").innerHTML = list.length ? list.map(function(c){
    return '<div class="cone"><span class="who">'+esc(c.author)+'</span><span class="when">'+esc(c.at)+'</span><br>'+esc(c.text)+'</div>';
  }).join("") : '<div class="cone">尚無留言</div>';
}

/* ---------- Firestore ---------- */
function fsSet(id, data){
  if (!db){ toast("目前離線，無法儲存"); return Promise.reject("offline"); }
  return db.collection(COL).doc(id).set(data).catch(function(e){
    setStatus("儲存失敗："+(e&&e.code||""), "bad");
    toast("儲存失敗，請檢查網路後再試");
    throw e;
  });
}
function addLog(action, name){
  var t = Date.now();
  fsSet("log_"+t+"_"+Math.floor(Math.random()*1000),
    {t:"log", author:who(), action:action, name:name, at:now(), ts:t});
}
function setPres(cellKey){
  var w = who(); if (!w || !db) return;
  db.collection(COL).doc("pres_"+w).set({t:"pres", who:w, cell:cellKey, ts:Date.now()}).catch(function(){});
}

if (db) db.collection(COL).onSnapshot(function(snap){
  cells = {}; rows = {}; cmts = []; logs = []; pres = {};
  snap.forEach(function(doc){
    var d = doc.data();
    if (d.t==="cell") cells[d.dim+"_"+d.row+"_"+d.role] = d;
    else if (d.t==="row"){ if(!rows[d.dim]) rows[d.dim]=[]; rows[d.dim].push(d); }
    else if (d.t==="cmt") cmts.push(d);
    else if (d.t==="log") logs.push(d);
    else if (d.t==="pres") pres[d.who] = d;
  });
  if (!connected){ connected = true; setStatus("已連線，即時同步", "ok"); }
  render();
}, function(err){
  setStatus("連線失敗："+(err&&err.code||""), "bad");
});
if (!db) setStatus("離線預覽（無同步）", "bad");

/* ---------- 事件 ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target;
  // 身分
  if (t.classList && t.classList.contains("pill")){
    document.querySelectorAll(".pill").forEach(function(p){p.classList.remove("on");});
    t.classList.add("on");
    try{ localStorage.setItem("kz_who", t.getAttribute("data-who")); }catch(e){}
    return;
  }
  // 頁籤
  if (t.classList && t.classList.contains("tab")){
    curDim = t.getAttribute("data-dim"); editingCell = null; panelCell = null; render(); return;
  }
  var act = t.getAttribute && t.getAttribute("data-act");
  if (!act && t.closest){
    var hd = t.closest("[data-act='g24toggle']");
    if (hd) act = "g24toggle";
  }
  if (act==="g24toggle"){ g24open = !g24open; renderG24(); return; }
  var td = t.closest ? t.closest("td[data-cell]") : null;

  // 自訂列改名
  var re = t.getAttribute && t.getAttribute("data-rowedit");
  if (re){
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    var cur = rowName(curDim, re);
    var nv = window.prompt("修改內容名稱", cur);
    if (nv && nv.trim() && nv.trim()!==cur){
      fsSet("row_"+curDim+"_"+re, {t:"row", dim:curDim, id:re, name:nv.trim(), order:(Date.now()), by:who()})
        .then(function(){ addLog("修改列名", nv.trim()); });
    }
    return;
  }
  if (act==="addrow"){
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    var nm = window.prompt("新內容名稱（例：1 自主查驗）");
    if (nm && nm.trim()){
      var rid = "r"+Date.now();
      fsSet("row_"+curDim+"_"+rid, {t:"row", dim:curDim, id:rid, name:nm.trim(), order:Date.now(), by:who()})
        .then(function(){ addLog("新增內容列", nm.trim()); });
    }
    return;
  }
  if ((act==="edit") || (t.closest && t.closest(".cellin"))){
    if (!td) return;
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    editingCell = td.getAttribute("data-cell"); panelCell = null;
    setPres(editingCell);
    render();
    var ta = document.getElementById("eta"); if (ta) ta.focus();
    return;
  }
  if (act==="cancel"){ editingCell = null; setPres(null); render(); return; }
  if (act==="save"){
    if (!td) return;
    var key = td.getAttribute("data-cell");
    var ta = document.getElementById("eta");
    var lines = ta.value.split("\n").map(function(x){return x.trim();}).filter(function(x){return x;});
    editingCell = null; setPres(null);
    if (lines.join("\n") === cellLines(key).join("\n")){ render(); return; }
    var p = key.split("_");
    fsSet("cell_"+key, {t:"cell", dim:p[0], row:p[1], role:p[2], lines:lines, by:who(), at:now(), ts:Date.now()})
      .then(function(){ addLog("修改內容", cName(key)); });
    render();
    return;
  }
  if (act==="cmt"){
    if (!td) return;
    panelCell = td.getAttribute("data-cell"); editingCell = null; render();
    document.getElementById("cpanel").scrollIntoView({behavior:"smooth", block:"nearest"});
    return;
  }
  if (t.id==="cclose"){ panelCell = null; renderPanel(); return; }
  if (t.id==="csend"){
    if (!panelCell) return;
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    var ci = document.getElementById("cinput");
    var txt = ci.value.trim(); if (!txt) return;
    var ts = Date.now();
    fsSet("cmt_"+ts+"_"+Math.floor(Math.random()*1000),
      {t:"cmt", cell:panelCell, author:who(), text:txt, at:now(), ts:ts})
      .then(function(){ addLog("留言", cName(panelCell)); });
    ci.value = "";
    return;
  }
});
document.getElementById("cinput").addEventListener("keydown", function(e){
  if (e.key==="Enter"){ document.getElementById("csend").click(); }
});

/* ---------- 啟動 ---------- */
try{
  var w = localStorage.getItem("kz_who");
  if (w){ document.querySelectorAll(".pill").forEach(function(p){ if(p.getAttribute("data-who")===w) p.classList.add("on"); }); }
}catch(e){}
render();
</script>

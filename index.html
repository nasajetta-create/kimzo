<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>職務考績表 職掌共編</title>
<style>
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#222; --muted:#777; --line:#aaa;
  --head:#455a64; --dim:#2c5f8a; --item:#f0f4f8; --meet:#5e4b8a;
  --r1:#2e7d32; --r2:#1565c0; --r3:#e65100; --r4:#b71c1c;
  --edit:#fffbe8; --accent:#1565c0; --ok:#2e7d32; --bad:#b02a2a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;}
.wrap{max-width:1360px;margin:0 auto;padding:12px 16px 40px;}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);
  border:1.5px solid #666;padding:8px 14px;margin-bottom:10px;}
.topbar .t{font-size:18px;font-weight:bold;}
.topbar .v{font-size:11px;color:var(--muted);}
.pill{border:1px solid #999;padding:4px 14px;font-size:13.5px;background:#f5f5f5;cursor:pointer;user-select:none;}
.pill.on{background:var(--dim);color:#fff;border-color:var(--dim);font-weight:bold;}
.tbtn{border:1px solid #999;padding:4px 12px;font-size:12.5px;background:#fff;color:#555;cursor:pointer;user-select:none;}
.tbtn.son{background:#8a5a00;color:#fff;border-color:#8a5a00;font-weight:bold;}
#status{margin-left:auto;font-size:12.5px;color:var(--muted);}
#status.ok{color:var(--ok);} #status.bad{color:var(--bad);}

/* ---------- 架構總覽 ---------- */
.ovbar{background:#2c5f8a;color:#fff;font-size:14px;font-weight:bold;padding:7px 14px;
  display:flex;align-items:center;cursor:pointer;user-select:none;margin-bottom:8px;}
.ovbar .tg{margin-left:auto;font-weight:normal;font-size:12.5px;}
.ovbox{background:#fff;border:1.5px solid #666;margin:-8px 0 10px;padding:10px 12px;}
.ovsw{display:flex;gap:6px;margin-bottom:8px;}
.ovsw span{border:1px solid #999;padding:3px 16px;font-size:12.5px;background:#f5f5f5;cursor:pointer;user-select:none;}
.ovsw span.on{background:#2c5f8a;color:#fff;border-color:#2c5f8a;font-weight:bold;}
.ovsub{font-size:11.5px;color:#666;margin-bottom:8px;line-height:1.7;}
.band{border-radius:4px;overflow:hidden;margin-bottom:7px;border:1px solid rgba(0,0,0,.15);}
.band-h{color:#fff;font-size:13px;font-weight:bold;text-align:center;padding:4px 0;position:relative;}
.band-h .tag{position:absolute;right:8px;top:4px;font-size:10px;font-weight:normal;
  background:rgba(255,255,255,.25);padding:0 6px;border-radius:3px;}
.cols{display:flex;flex-wrap:wrap;}
.col{flex:1 1 150px;padding:6px 10px 7px;border-right:1px solid rgba(0,0,0,.12);}
.col:last-child{border-right:0;}
.col h4{font-size:12px;margin:0 0 3px;font-weight:bold;}
.col .cl{font-size:11.5px;line-height:1.75;}
.c1 .band-h{background:#1b7a5a}.c1 .cols{background:#e9f5ef}.c1 h4,.c1 .cl{color:#155c44}
.c2 .band-h{background:#b02a2a}.c2 .cols{background:#fdeeee}.c2 h4,.c2 .cl{color:#8c1f1f}
.c3 .band-h{background:#1c5fa8}.c3 .cols{background:#e9f1fa}.c3 h4,.c3 .cl{color:#164a83}
.c4 .band-h{background:#8a5a00}.c4 .cols{background:#faf1de}.c4 h4,.c4 .cl{color:#6d4700}
.c5 .band-h{background:#4b44b8}.c5 .cols{background:#eeedfa}.c5 h4,.c5 .cl{color:#3a3494}
.c6 .band-h{background:#b03355}.c6 .cols{background:#fdeef3}.c6 h4,.c6 .cl{color:#8c2743}

/* ---------- 2024 原始資料 ---------- */
.g24{border:1.5px solid #888;background:#e9e9e9;margin-bottom:8px;}
.g24 .hd{background:#666;color:#fff;font-size:13px;font-weight:bold;padding:6px 12px;display:flex;cursor:pointer;user-select:none;}
.g24 .hd .tg{margin-left:auto;font-weight:normal;font-size:12px;}
.g24 .bd{padding:8px 12px;background:#f2f2f2;}
.g24 .bd .l24{font-size:12.5px;color:#444;line-height:1.85;padding:2px 0;border-bottom:1px dashed #d0d0d0;}
.g24 .bd .l24:last-child{border-bottom:none;}
.g24 .bd .l24 b{color:#222;}
.g24 .bd .l24 .wh{color:#777;font-size:11.5px;}

/* ---------- 頁籤與表格 ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:0;}
.tab{border:1px solid #999;border-bottom:none;padding:6px 14px;font-size:13.5px;background:#e4e7ea;cursor:pointer;user-select:none;}
.tab.on{background:var(--dim);color:#fff;border-color:var(--dim);font-weight:bold;}
.tab .cnt{font-size:11.5px;color:#666;margin-left:4px;}
.tab.on .cnt{color:#dbe7f2;}
.tab.mt{background:#efe9f6;}
.tab.mt.on{background:var(--meet);border-color:var(--meet);color:#fff;}
.tblbox{overflow-x:auto;background:var(--card);border:1.5px solid #666;}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px;}
th{background:var(--head);color:#fff;padding:6px 8px;border:1px solid #888;font-size:13.5px;font-weight:bold;}
th.re{background:var(--r1)} th.rg{background:var(--r2)} th.rm{background:var(--r3)} th.rd{background:var(--r4)}
td{border:1px solid var(--line);padding:0;vertical-align:top;}
td.dim{background:var(--dim);color:#fff;font-weight:bold;text-align:center;font-size:13px;width:58px;padding:6px 4px;}
td.item{background:var(--item);font-weight:bold;width:118px;padding:6px 8px;font-size:13px;}
td.item .rn{cursor:pointer;}
td.item .rn:hover{color:var(--accent);text-decoration:underline;}
td.duty{min-width:180px;}
.grpm{display:none;}
.rlab{display:none;}
.dot{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle;}
.dot.d1{background:#2e7d32;}
.dot.d2{background:#e08000;}
.dot.d3{background:#bbb;}
.cellin{padding:6px 8px 3px;cursor:pointer;min-height:38px;}
.cellin:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.cellin.lockd{cursor:default;background:#fafafa;}
.cellin.lockd:hover{outline:none;}
.cellin ol{margin:0;padding-left:18px;line-height:1.6;}
.cellin li{margin:1px 0;}
.cellin .empty{color:#bbb;}
.cfoot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:1px 8px 5px;font-size:11px;color:var(--muted);}
.cfoot .cbtn{margin-left:auto;border:1px solid #bbb;background:#f5f5f5;color:#555;font-size:11px;padding:0 8px;cursor:pointer;}
.cfoot .cbtn.has{border-color:var(--accent);color:var(--accent);font-weight:bold;}
.cfoot .unlk{border:1px solid #bbb;background:#f5f5f5;color:#555;font-size:11px;padding:0 8px;cursor:pointer;}
.cfoot .pres{color:var(--bad);font-weight:bold;}
.cfoot .lk{background:#dcdcdc;color:#555;border:1px solid #bbb;font-size:10.5px;padding:0 5px;}
.cfoot .meta{cursor:pointer;text-decoration:underline dotted;}
.cfoot .meta:hover{color:var(--accent);}
.editbox{padding:6px;background:var(--edit);outline:2px solid #e6a817;outline-offset:-2px;}
.editbox textarea{width:100%;min-height:110px;font-size:13px;font-family:inherit;border:1px solid #ccc;padding:6px;line-height:1.6;}
.editbox .hint{font-size:11px;color:var(--muted);margin:2px 0;}
.ebtns{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap;}
.ebtns button{font-size:12.5px;padding:4px 12px;border:1px solid #999;cursor:pointer;background:#fff;}
.ebtns .save{background:var(--dim);color:#fff;border-color:var(--dim);}
.ebtns .lock{background:var(--ok);color:#fff;border-color:var(--ok);}
.addrow{margin:8px 0 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.addrow button{font-size:12.5px;padding:5px 14px;border:1px solid var(--dim);background:#fff;color:var(--dim);cursor:pointer;}
.addrow .agl{font-size:12px;color:#666;margin-left:6px;}
.addrow select{font-size:12.5px;padding:3px 6px;border:1px solid #999;background:#fff;font-family:inherit;}
/* ---------- 編輯架構 ---------- */
.sctl{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.sctl button{font-size:10.5px;padding:0 5px;border:1px solid #8a5a00;background:#fff;color:#8a5a00;
  cursor:pointer;font-family:inherit;line-height:1.7;}
.sctl button:hover{background:#8a5a00;color:#fff;}
td.dim .sctl{justify-content:center;}
td.dim .sctl button{background:#fff;}
.hidsec{margin-top:8px;background:var(--card);border:1.5px solid #8a5a00;padding:6px 12px;font-size:12px;color:#555;}
.hidsec h3{font-size:12.5px;margin:0 0 4px;color:#8a5a00;}
.hidsec .hrow{display:flex;gap:10px;align-items:center;line-height:2;flex-wrap:wrap;}
.hidsec .hw{color:#999;font-size:11px;}
.hidsec button{font-size:11px;padding:1px 10px;border:1px solid #8a5a00;background:#fff;color:#8a5a00;cursor:pointer;}

/* ---------- 會議紀錄 ---------- */
.mtop{margin:8px 0 10px;}
.mtop button{font-size:12.5px;padding:5px 14px;border:1px solid var(--meet);background:#fff;color:var(--meet);cursor:pointer;}
.mcard{background:var(--card);border:1.5px solid #666;margin-bottom:10px;}
.mcard .mh{background:var(--meet);color:#fff;padding:6px 14px;font-size:13.5px;font-weight:bold;display:flex;gap:12px;flex-wrap:wrap;}
.mcard .mb{padding:8px 16px 4px;}
.mcard .mb ol{margin:0;padding-left:20px;line-height:1.8;font-size:13px;}
.mcard .mb li{margin:2px 0;}
.mcard .mf{display:flex;gap:8px;align-items:center;padding:2px 14px 8px;font-size:11.5px;color:var(--muted);}
.mcard .mf .cbtn{margin-left:auto;border:1px solid #bbb;background:#f5f5f5;color:#555;font-size:11px;padding:1px 10px;cursor:pointer;}
.mcard .mf .cbtn.has{border-color:var(--accent);color:var(--accent);font-weight:bold;}

/* ---------- 留言 / 紀錄 / 備份 ---------- */
.cpanel{display:none;margin-top:12px;background:var(--card);border:1.5px solid var(--accent);padding:10px 14px;}
.cpanel.show{display:block;}
.cpanel h3{font-size:14px;margin:0 0 8px;}
.cone{border-bottom:1px dashed #ccc;padding:4px 0;font-size:12.5px;line-height:1.6;}
.cone .who{font-weight:bold;color:var(--accent);margin-right:8px;}
.cone .when{color:var(--muted);font-size:11px;}
.crow{display:flex;gap:8px;margin-top:8px;}
.crow input{flex:1;font-size:13px;border:1px solid #ccc;padding:5px 8px;}
.crow button{font-size:12.5px;padding:4px 14px;border:1px solid var(--dim);background:var(--dim);color:#fff;cursor:pointer;}
.crow .cls{background:#fff;color:#555;border-color:#999;}
.logsec{margin-top:12px;background:var(--card);border:1.5px solid #666;padding:8px 14px;font-size:12px;color:var(--muted);}
.logsec h3{font-size:13px;margin:0 0 4px;color:var(--ink);}
.logsec div{line-height:1.8;}
.bksec{margin-top:10px;background:var(--card);border:1.5px solid #666;padding:8px 14px;font-size:12px;color:var(--muted);}
.bksec h3{font-size:13px;margin:0 0 6px;color:var(--ink);}
.bksec .bkrow{display:flex;gap:8px;align-items:center;line-height:2;}
.bksec button{font-size:11.5px;padding:2px 10px;border:1px solid #999;background:#f5f5f5;color:#444;cursor:pointer;}
.bksec .exp{border-color:var(--dim);color:var(--dim);background:#fff;font-size:12.5px;padding:4px 14px;}
.bksec .bkhead{margin:6px 0 2px;}
.foot{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--dim);color:#fff;
  padding:8px 20px;font-size:13px;display:none;z-index:99;}
.toast.show{display:block;}

/* ---------- 覆蓋層 ---------- */
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:none;
  z-index:30;justify-content:center;align-items:flex-start;padding:26px 12px;overflow:auto;}
.ovl.show{display:flex;}
.ovl .box{background:#fff;border:1.5px solid #444;width:100%;max-width:640px;padding:12px 16px 14px;}
.ovl h3{font-size:14.5px;margin:0 0 8px;}
.ovl label{display:block;font-size:12px;color:#555;margin:6px 0 2px;}
.ovl input,.ovl textarea{width:100%;font-size:13px;font-family:inherit;border:1px solid #ccc;padding:5px 8px;}
.ovl textarea{min-height:140px;line-height:1.7;}
.ovl .obtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.ovl .obtns button{font-size:12.5px;padding:5px 16px;border:1px solid #999;background:#fff;cursor:pointer;}
.ovl .obtns .pri{background:var(--dim);color:#fff;border-color:var(--dim);}
.vbox{border:1px solid #ccc;padding:6px 10px;margin-bottom:8px;background:#fafafa;}
.vbox .vh{font-size:12px;color:#555;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.vbox .vh .cur{background:var(--dim);color:#fff;font-size:10.5px;padding:0 6px;}
.vbox .vh button{margin-left:auto;font-size:11.5px;padding:1px 10px;border:1px solid #999;background:#fff;cursor:pointer;}
.vbox ol{margin:4px 0 2px;padding-left:20px;font-size:12.5px;line-height:1.65;}

/* ---------- 手機卡片檢視 ---------- */
@media (max-width:700px){
  .wrap{padding:10px 10px 30px;}
  .tblbox{overflow-x:visible;background:transparent;border:none;}
  #tbl{min-width:0;width:100%;display:block;font-size:13px;}
  #tbl thead,#tbl tbody{display:block;}
  #tbl tr{display:block;background:var(--card);border:1.5px solid #666;margin-bottom:10px;}
  #tbl tr.hdr{display:none;}
  #tbl tr.nod{border:none;}
  #tbl td{display:block;border:none;border-bottom:1px solid #ddd;width:auto;min-width:0;}
  #tbl td.dim{display:none;}
  #tbl td.item{width:auto;font-size:14px;padding:7px 10px;}
  #tbl td.duty:last-child{border-bottom:none;}
  .grpm{display:block;font-weight:normal;font-size:11px;color:#667;margin-bottom:2px;}
  .rlab{display:block;font-size:12px;font-weight:bold;padding:5px 10px 0;}
  .rlab.le{color:var(--r1);} .rlab.lg{color:var(--r2);}
  .rlab.lm{color:var(--r3);} .rlab.ld{color:var(--r4);}
  .cellin{padding:3px 10px 3px;}
  .cfoot{padding:1px 10px 6px;}
  .ovbox{padding:8px;}
  .col{flex:1 1 100%;border-right:0;border-bottom:1px solid rgba(0,0,0,.12);}
  .col:last-child{border-bottom:0;}
}

/* ---------- 列印 ---------- */
@page{size:A3 landscape;margin:10mm;}
@media print{
  html,body{background:#fff;}
  .wrap{max-width:none;padding:0;}
  .topbar .pill,.topbar .tbtn,#status,.tabs,.ovbar,.ovbox,#g24box,
  .cpanel,.logsec,.bksec,.addrow,.foot,.toast,.ovl,.mtop,
  .sctl,.hidsec,#hidsec{display:none !important;}
  .topbar{border:none;padding:0 0 6px;margin-bottom:6px;}
  .tblbox{border:1px solid #000;overflow:visible;}
  table{min-width:0;width:100%;font-size:11px;}
  th{font-size:11.5px;padding:4px 5px;}
  .cellin{padding:4px 6px 2px;min-height:0;}
  .cellin:hover{outline:none !important;}
  .cellin ol{padding-left:15px;line-height:1.45;}
  .cfoot .cbtn,.cfoot .unlk,.cfoot .pres{display:none !important;}
  .cfoot{padding:0 6px 3px;font-size:9.5px;}
  tr{page-break-inside:avoid;}
  .mcard{border:1px solid #000;page-break-inside:avoid;}
  .mcard .mf .cbtn{display:none !important;}
}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <span class="t">職務考績表 職掌共編</span><span class="v" id="ver">K0918-05</span>
  <span class="pill" data-who="艋舺良">艋舺良</span>
  <span class="pill" data-who="沈協理">沈協理</span>
  <span class="tbtn" id="stbtn" data-act="struct">編輯架構</span>
  <span class="tbtn" data-act="print">列印</span>
  <span id="status">連線中…</span>
</div>

<div id="ovwrap"></div>

<div class="tabs" id="tabs"></div>
<div id="g24box"></div>
<div class="tblbox" id="tblbox"><table id="tbl"></table></div>
<div id="meetbox"></div>
<div id="hidsec"></div>
<div class="addrow" id="addrow"></div>

<div class="cpanel" id="cpanel">
  <h3 id="ctitle">留言</h3>
  <div id="clist"></div>
  <div class="crow">
    <input id="cinput" placeholder="輸入留言後按送出">
    <button id="csend">送出</button>
    <button class="cls" id="cclose">關閉</button>
  </div>
</div>

<div class="logsec"><h3>異動紀錄（最近 10 筆）</h3><div id="loglist">尚無異動</div></div>

<div class="bksec" id="bksec"></div>

<div class="foot">
規則：基礎＝2024版；第一輪＝職掌，不寫評分基準。每構面上方灰色區塊＝2024 原始資料的項目與內容（唯讀對照），下方＝更新後對照表。構面1、2 已預載並預設定案，需先解鎖才能修改；構面3～6 已預載項目列，格子點開即可填寫。<br>
點格子編輯、按「註」留言；點格底的修改者時間可看該格的歷史版本。每日自動保存一次快照，可於下方備份區還原或匯出。<br>
編輯架構開關可改項目與內容名稱、順序與隱藏，隱藏可復原。
</div>

</div>
<div class="toast" id="toast"></div>
<div class="ovl" id="ovl"><div class="box" id="ovlbox"></div></div>

function rowState(dim, rowId){

}

/* 原始架構：固定列在前、自訂列在後，base＝原始索引 */
function baseRows(dim){
  var fixed = FIXED_ROWS[dim] ? FIXED_ROWS[dim].slice() : [];
  var extra = (rows[dim]||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  var out = [];
  fixed.forEach(function(r){
    out.push({id:r.id, grp:r.grp||"自訂", name:r.name, fixed:true, base:out.length});
  });
  extra.forEach(function(r){
    out.push({id:r.id, grp:r.grp||"自訂", name:r.name, fixed:false, base:out.length});
  });
  return out;
}
/* 套用 rowmod（改名／隱藏／排序）；withHidden 為 true 時連隱藏列一起回傳 */
function allRows(dim, withHidden){
  var out = [];
  baseRows(dim).forEach(function(r){
    var m = rowmods[dim+"_"+r.id];
    var o = {id:r.id, grp:r.grp, name:r.name, fixed:r.fixed, base:r.base, hidden:false, ord:r.base*10};
    if (m){
      if (typeof m.name==="string" && m.name) o.name = m.name;
      if (m.hidden===true) o.hidden = true;
      if (typeof m.ord==="number") o.ord = m.ord;
    }
    out.push(o);
  });
  var gOrder = [], gMap = {};
  out.forEach(function(r){
    if (!gMap[r.grp]){ gMap[r.grp] = []; gOrder.push(r.grp); }
    gMap[r.grp].push(r);
  });
  var fin = [];
  gOrder.forEach(function(g){
    gMap[g].sort(function(a,b){ return (a.ord-b.ord) || (a.base-b.base); });
    gMap[g].forEach(function(r){ fin.push(r); });
  });
  if (!withHidden) fin = fin.filter(function(r){ return !r.hidden; });
  return fin;
}
function groupList(dim){
  var seen = {}, out = [];
  allRows(dim, true).forEach(function(r){
    if (!seen[r.grp]){ seen[r.grp] = 1; out.push(r.grp); }
  });
  if (!seen["自訂"]) out.push("自訂");
  return out;
}
function rowName(dim,rowId){
  var list = allRows(dim, true);
  for (var i=0;i<list.length;i++) if (list[i].id===rowId) return list[i].name;
  return rowId;
}
function rowHasLock(dim,rowId){
  var f = false;
  ROLES.forEach(function(r){ if (cellLocked(dim+"_"+rowId+"_"+r[0])) f = true; });
  return f;
}
function allMeets(){
  var out = MEET_FIX.map(function(m){
    return {id:m.id, date:m.date, title:m.title, lines:m.lines, src:m.src, fix:true};
  });
  Object.keys(meets).forEach(function(k){
    var m = meets[k];
    out.push({id:m.id||k.replace(/^meet_/,""), date:m.date||"", title:m.title||"", lines:m.lines||[],
      src:(m.by? "由 "+m.by+" 新增 "+(m.at||"") : ""), fix:false, docId:k});
  });
  out.sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  return out;
}
function findMeet(id){
  var l = allMeets();
  for (var i=0;i<l.length;i++) if (l[i].id===id) return l[i];

}

}

/* ---------- Firestore ---------- */
function fsSet(id, data){
  if (!db){ toast("目前離線，無法儲存"); return Promise.reject("offline"); }
  return db.collection(COL).doc(id).set(data).catch(function(e){
    setStatus("儲存失敗："+(e&&e.code||""), "bad");
    toast("儲存失敗，請檢查網路後再試");
    throw e;
  });
}
function addLog(action, name){
  var t = Date.now();
  fsSet("log_"+t+"_"+Math.floor(Math.random()*1000),
    {t:"log", author:who(), action:action, name:name, at:now(), ts:t}).catch(function(){});
}
function setPres(cellKey){
  var w = who(); if (!w || !db) return;
  db.collection(COL).doc("pres_"+w).set({t:"pres", who:w, cell:cellKey, ts:Date.now()}).catch(function(){});
}

/* ---------- 架構編輯：rowmod / grpmod ---------- */
function setRowMod(dim, rowId, patch){
  var old = rowmods[dim+"_"+rowId] || {};
  var d = {t:"rowmod", dim:dim, row:rowId,
    hidden: (patch.hasOwnProperty("hidden") ? (patch.hidden===true) : (old.hidden===true)),
    by:who(), at:now(), ts:Date.now()};
  var nm = patch.hasOwnProperty("name") ? patch.name : old.name;
  if (typeof nm==="string" && nm) d.name = nm;
  var od = patch.hasOwnProperty("ord") ? patch.ord : old.ord;
  if (typeof od==="number") d.ord = od;
  return fsSet("rowmod_"+dim+"_"+rowId, d);
}
function doRowRename(dim, rowId){
  if (!who()){ toast("請先選擇上方你的名字"); return; }
  if (rowHasLock(dim, rowId)){ toast("此列有定案格，先解鎖"); return; }
  var cur = rowName(dim, rowId);
  var nv = window.prompt("修改內容名稱", cur);
  if (!nv || !nv.trim() || nv.trim()===cur) return;
  setRowMod(dim, rowId, {name:nv.trim()})
    .then(function(){ addLog("改列名", cur+" 改為 "+nv.trim()); }).catch(function(){});
}
function doRowHide(dim, rowId, hide){
  if (!who()){ toast("請先選擇上方你的名字"); return; }
  if (hide && rowHasLock(dim, rowId)){ toast("此列有定案格，先解鎖"); return; }
  var nm = rowName(dim, rowId);
  setRowMod(dim, rowId, {hidden:hide})
    .then(function(){ addLog(hide ? "隱藏列" : "復原列", nm); }).catch(function(){});
}
function moveRow(dim, rowId, dir){
  if (!who()){ toast("請先選擇上方你的名字"); return; }
  var vis = allRows(dim), cur = null, vi = -1;
  vis.forEach(function(r,i){ if (r.id===rowId){ cur = r; vi = i; } });
  if (!cur) return;
  var k = vi + dir;
  var nb = (k>=0 && k<vis.length && vis[k].grp===cur.grp) ? vis[k] : null;
  if (!nb){ toast("已經在此項目的"+(dir<0?"最上面":"最下面")+"了"); return; }
  var full = allRows(dim, true).filter(function(r){ return r.grp===cur.grp; });
  var ia = -1, ib = -1;
  full.forEach(function(r,i){ if (r.id===cur.id) ia = i; if (r.id===nb.id) ib = i; });
  if (ia<0 || ib<0) return;
  var tmp = full[ia]; full[ia] = full[ib]; full[ib] = tmp;
  var jobs = full.map(function(r,i){ return setRowMod(dim, r.id, {ord:i*10}); });
  Promise.all(jobs).then(function(){
    addLog("移動列", cur.name+"（"+(dir<0?"上移":"下移")+"）");
  }).catch(function(){});
}
function doGrpRename(dim, g){
  if (!who()){ toast("請先選擇上方你的名字"); return; }
  var cur = grpName(dim, g);
  var nv = window.prompt("修改項目名稱", cur);
  if (!nv || !nv.trim() || nv.trim()===cur) return;
  fsSet("grpmod_"+dim+"_"+gkey(g),
    {t:"grpmod", dim:dim, grp:g, name:nv.trim(), by:who(), at:now(), ts:Date.now()})
    .then(function(){ addLog("改項目名", cur+" 改為 "+nv.trim()); }).catch(function(){});
}
function saveCell(key, lines, lock, actName){
  var p = key.split("_");
  var old = cells[key];
  var hist = [];
  if (old){
    hist = [{lines:(old.lines||[]), by:(old.by||""), at:(old.at||"")}].concat(old.hist||[]).slice(0,3);
  } else if (SEED[key]){
    hist = [{lines:SEED[key], by:"預載", at:""}];
  }
  var lockV = (lock===true) ? true : (old ? !!old.locked : false);
  return fsSet("cell_"+key, {t:"cell", dim:p[0], row:p[1], role:p[2], lines:lines,
      by:who(), at:now(), ts:Date.now(), locked:lockV, hist:hist})
    .then(function(){ addLog(actName || (lock===true ? "修改並定案" : "修改內容"), cName(key)); });
}
function unlockCell(key){
  var p = key.split("_");
  var old = cells[key];
  var d;
  if (old){
    d = {t:"cell", dim:old.dim||p[0], row:old.row||p[1], role:old.role||p[2],
         lines:(old.lines||[]), by:(old.by||who()), at:(old.at||now()), ts:(old.ts||Date.now()),
         locked:false, hist:(old.hist||[])};
  } else {
    d = {t:"cell", dim:p[0], row:p[1], role:p[2], lines:(SEED[key]||[]),
         by:who(), at:now(), ts:Date.now(), locked:false, hist:[]};
  }
  fsSet("cell_"+key, d).then(function(){ addLog("解除定案", cName(key)); }).catch(function(){});
}

/* ---------- 每日自動快照 ---------- */
function doSnap(){
  if (snapDone || !db) return;
  snapDone = true;
  var ds = tpDay();
  if (snaps[ds]){ cleanSnaps(); return; }
  var payload;
  try{ payload = JSON.stringify({cells:cells, rows:rows, meets:meets, rowmods:rowmods, grpmods:grpmods}); }
  catch(e){ return; }
  try{
    db.collection(COL).doc("snap_"+ds).set({t:"snap", date:ds, ts:Date.now(), data:payload})
      .then(function(){ cleanSnaps(); })
      .catch(function(){});
  }catch(e2){ /* 快照失敗不影響主功能 */ }
}
function cleanSnaps(){
  if (!db) return;
  var lim = Date.now() - 14*86400000;
  Object.keys(snaps).forEach(function(d){
    var s = snaps[d];
    if (s && s.t==="snap" && s.ts && s.ts < lim){
      try{ db.collection(COL).doc("snap_"+d).delete().catch(function(){}); }catch(e){}
    }
  });
}
function restoreSnap(ds){
  var s = snaps[ds];
  if (!s){ toast("找不到該快照"); return; }
  if (!who()){ toast("請先選擇上方你的名字"); return; }
  if (!window.confirm("警告：還原 "+dayLabel(ds)+" 的快照，會用該日內容覆蓋現在的職掌格子、自訂列與新增會議紀錄，現有較新的內容將被蓋掉且無法復原。確定要還原嗎？")) return;
  var o;
  try{ o = JSON.parse(s.data||"{}"); }
  catch(e){ toast("快照資料損毀，無法還原"); return; }
  var n = 0;
  Object.keys(o.cells||{}).forEach(function(k){
    fsSet("cell_"+k, o.cells[k]).catch(function(){}); n++;
  });
  Object.keys(o.rows||{}).forEach(function(dim){
    (o.rows[dim]||[]).forEach(function(r){ fsSet("row_"+dim+"_"+r.id, r).catch(function(){}); n++; });
  });
  Object.keys(o.meets||{}).forEach(function(mid){
    fsSet(mid, o.meets[mid]).catch(function(){}); n++;
  });
  Object.keys(o.rowmods||{}).forEach(function(rk){
    var rm = o.rowmods[rk];
    if (rm && rm.dim && rm.row){ fsSet("rowmod_"+rm.dim+"_"+rm.row, rm).catch(function(){}); n++; }
  });
  Object.keys(o.grpmods||{}).forEach(function(gk){
    var gm = o.grpmods[gk];
    if (gm && gm.dim && gm.grp){ fsSet("grpmod_"+gm.dim+"_"+gkey(gm.grp), gm).catch(function(){}); n++; }
  });
  addLog("還原備份", dayLabel(ds));
  toast("已送出還原 "+n+" 筆");
}
function expBackup(){
  var o = {ver:CODE_VERSION, at:now(), cells:cells, rows:rows, cmts:cmts, logs:logs, meets:meets,
           rowmods:rowmods, grpmods:grpmods};
  var txt;
  try{ txt = JSON.stringify(o, null, 1); }
  catch(e){ toast("匯出失敗"); return; }
  try{
    var blob = new Blob([txt], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "kimzo備份_"+tpStamp()+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 800);
    toast("已匯出備份檔");
  }catch(e2){ toast("匯出失敗"); }
}

if (db) db.collection(COL).onSnapshot(function(snap){
  cells = {}; rows = {}; cmts = []; logs = []; pres = {}; meets = {}; snaps = {};
  rowmods = {}; grpmods = {};
  snap.forEach(function(doc){
    var d = doc.data();
    if (d.t==="cell") cells[d.dim+"_"+d.row+"_"+d.role] = d;
    else if (d.t==="row"){ if(!rows[d.dim]) rows[d.dim]=[]; rows[d.dim].push(d); }
    else if (d.t==="cmt") cmts.push(d);
    else if (d.t==="log") logs.push(d);
    else if (d.t==="pres") pres[d.who] = d;
    else if (d.t==="meet") meets[doc.id] = d;
    else if (d.t==="snap") snaps[d.date] = d;
    else if (d.t==="rowmod") rowmods[d.dim+"_"+d.row] = d;
    else if (d.t==="grpmod") grpmods[d.dim+"|"+d.grp] = d;
  });
  if (!connected){ connected = true; setStatus("已連線，即時同步", "ok"); }
  render();
  doSnap();
}, function(err){
  setStatus("連線失敗："+(err&&err.code||""), "bad");
});
if (!db) setStatus("離線預覽（無同步）", "bad");

/* ---------- 事件 ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target;
  // 身分
  if (t.classList && t.classList.contains("pill")){
    document.querySelectorAll(".pill").forEach(function(p){p.classList.remove("on");});
    t.classList.add("on");
    try{ localStorage.setItem("kz_who", t.getAttribute("data-who")); }catch(e){}
    return;
  }
  // 頁籤
  if (t.classList && t.classList.contains("tab")){
    curDim = t.getAttribute("data-dim"); editingCell = null; panelCell = null; render(); return;
  }
  var act = t.getAttribute && t.getAttribute("data-act");
  if (!act && t.closest){
    var hd = t.closest("[data-act]");
    if (hd) act = hd.getAttribute("data-act");
  }
  if (act==="print"){ window.print(); return; }
  if (act==="ovtoggle"){ ovOpen = !ovOpen; renderOv(); return; }
  if (act==="ovnew"){ ovMode = "new"; renderOv(); return; }
  if (act==="ovold"){ ovMode = "old"; renderOv(); return; }
  if (act==="g24toggle"){ g24open = !g24open; renderG24(); return; }
  if (act==="ovlclose"){ ovlClose(); return; }
  if (act==="export"){ expBackup(); return; }
  if (act==="struct"){ structMode = !structMode; render(); return; }
  if (act==="restore"){
    var day = (t.getAttribute && t.getAttribute("data-day")) || (t.closest("[data-day]") && t.closest("[data-day]").getAttribute("data-day"));
    if (day) restoreSnap(day);
    return;
  }
  if (act==="revert"){
    var rk = t.getAttribute("data-key"), ri = parseInt(t.getAttribute("data-i"),10);
    var cc = cells[rk];
    var hv = cc && cc.hist && cc.hist[ri];
    if (!hv){ toast("找不到該版本"); return; }
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    if (cellLocked(rk)){ toast("此格已定案，先按解鎖"); return; }
    ovlClose();
    saveCell(rk, (hv.lines||[]).slice(), false, "還原舊版").catch(function(){});
    return;
  }
  if (act==="addmeet"){
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    openMeetForm(); return;
  }
  if (act==="meetsave"){
    var fd = document.getElementById("mfd"), ft = document.getElementById("mft"), fl = document.getElementById("mfl");
    if (!fd || !ft || !fl) return;
    var vd = fd.value.trim(), vt = ft.value.trim();
    var vl = fl.value.split("\n").map(function(x){return x.trim();}).filter(function(x){return x;});
    if (!vd || !vt){ toast("請填日期與會議名"); return; }
    var mts = Date.now();
    fsSet("meet_"+mts, {t:"meet", id:String(mts), date:vd, title:vt, lines:vl, by:who(), at:now(), ts:mts})
      .then(function(){ addLog("新增會議紀錄", vd+" "+vt); }).catch(function(){});
    ovlClose();
    return;
  }
  var td = t.closest ? t.closest("[data-cell]") : null;

  // 列名改名（自訂列點名稱，或編輯架構的改名鈕；統一走 rowmod）
  var re = t.getAttribute && t.getAttribute("data-rowedit");
  if (re){ doRowRename(curDim, re); return; }
  var srow = t.getAttribute && t.getAttribute("data-row");
  if (act==="rowren"){ if (srow) doRowRename(curDim, srow); return; }
  if (act==="rowup"){ if (srow) moveRow(curDim, srow, -1); return; }
  if (act==="rowdn"){ if (srow) moveRow(curDim, srow, 1); return; }
  if (act==="rowhide"){ if (srow) doRowHide(curDim, srow, true); return; }
  if (act==="rowshow"){ if (srow) doRowHide(curDim, srow, false); return; }
  if (act==="grpren"){
    var sg = t.getAttribute && t.getAttribute("data-grp");
    if (sg) doGrpRename(curDim, sg);
    return;
  }
  if (act==="addrow"){
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    var sel = document.getElementById("addgrp");
    var ng = (sel && sel.value) ? sel.value : "自訂";
    var nm = window.prompt("新內容名稱（例：1 自主查驗）");
    if (nm && nm.trim()){
      var rid = "r"+Date.now();
      fsSet("row_"+curDim+"_"+rid,
        {t:"row", dim:curDim, id:rid, name:nm.trim(), grp:ng, order:Date.now(), by:who()})
        .then(function(){ addLog("新增內容列", grpName(curDim,ng)+"　"+nm.trim()); }).catch(function(){});
    }
    return;
  }
  if (act==="unlock"){
    if (!td) return;
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    unlockCell(td.getAttribute("data-cell"));
    return;
  }
  if (act==="hist"){
    if (!td) return;
    openHist(td.getAttribute("data-cell"));
    return;
  }
  if ((act==="edit") || (t.closest && t.closest(".cellin"))){
    if (!td) return;
    var ek = td.getAttribute("data-cell");
    if (cellLocked(ek)){ toast("此格已定案，先按解鎖"); return; }
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    editingCell = ek; panelCell = null;
    setPres(editingCell);
    render();
    var ta = document.getElementById("eta"); if (ta) ta.focus();
    return;
  }
  if (act==="cancel"){ editingCell = null; setPres(null); render(); return; }
  if (act==="save" || act==="savelock"){
    if (!td) return;
    var key = td.getAttribute("data-cell");
    var ta2 = document.getElementById("eta");
    if (!ta2) return;
    var lines = ta2.value.split("\n").map(function(x){return x.trim();}).filter(function(x){return x;});
    var lock = (act==="savelock");
    editingCell = null; setPres(null);
    if (!lock && lines.join("\n") === cellLines(key).join("\n")){ render(); return; }
    saveCell(key, lines, lock).catch(function(){});
    render();
    return;
  }
  if (act==="cmt"){
    if (!td) return;
    panelCell = td.getAttribute("data-cell"); editingCell = null; render();
    document.getElementById("cpanel").scrollIntoView({behavior:"smooth", block:"nearest"});
    return;
  }
  if (t.id==="cclose"){ panelCell = null; renderPanel(); return; }
  if (t.id==="csend"){
    if (!panelCell) return;
    if (!who()){ toast("請先選擇上方你的名字"); return; }
    var ci = document.getElementById("cinput");
    var txt = ci.value.trim(); if (!txt) return;
    var ts = Date.now();
    fsSet("cmt_"+ts+"_"+Math.floor(Math.random()*1000),
      {t:"cmt", cell:panelCell, author:who(), text:txt, at:now(), ts:ts})
      .then(function(){ addLog("留言", cName(panelCell)); }).catch(function(){});
    ci.value = "";
    return;
  }
  if (t.id==="ovl"){ ovlClose(); return; }
});
document.getElementById("cinput").addEventListener("keydown", function(e){
  if (e.key==="Enter"){ document.getElementById("csend").click(); }
});

/* ---------- 啟動 ---------- */
try{
  var w0 = localStorage.getItem("kz_who");
  if (w0){ document.querySelectorAll(".pill").forEach(function(p){ if(p.getAttribute("data-who")===w0) p.classList.add("on"); }); }
}catch(e){}
render();
</script>
